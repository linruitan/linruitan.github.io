              <figure class="photo-cell">

              </figure>
              <figure class="photo-cell">
                <img src="Photography/Never%20afraid.jpg" alt="Philadelphia Museum of Art steps">
                <figcaption class="photo-caption">March 2026 · Philadelphia Museum of Art steps — <em>Never Afraid</em></figcaption>
              </figure>
              <figure class="photo-cell">
                <img src="Photography/%E7%A5%88%E6%84%BF%E8%AF%B8%E4%BD%9B.jpg" alt="Niushou Mountain Buddhist site, Nanjing">
                <figcaption class="photo-caption">December 2025 · Niushou Mountain, Nanjing, Jiangsu — <em>Prayers to the Buddhas</em> (《祈愿诸佛》)</figcaption>
              </figure>
              <figure class="photo-cell">

              </figure>

                <figcaption class="photo-caption">May 2025 · At the foot of Cangshan and Erhai, Yunnan — <em>Life beneath the Storm Clouds</em> (《乌云下的生机》)</figcaption>
              </figure>
              <figure class="photo-cell">
                <img src="Photography/%E8%87%AA%E7%94%BB%E8%8F%A9%E8%90%A8.jpg" alt="Self-painted bodhisattva portrait, Hangzhou">
                <figcaption class="photo-caption">June 2025 · Hangzhou — <em>Self-Painted Bodhisattva</em> (《自画菩萨》)</figcaption>
              </figure>
              <figure class="photo-cell">
                <img src="Photography/%E5%88%9D%E7%94%9F.jpg" alt="Laoqitai, Qitai, Xinjiang">
                <figcaption class="photo-caption">July 2025 · Laoqitai, Qitai, Xinjiang — <em>First Light</em> (《初生》)</figcaption>

              <figure class="photo-cell">
                <img src="Photography/%E6%B2%99%E6%BC%A0%E4%B8%AD%E7%9A%84%E5%BF%8D%E8%BE%B1%E7%94%9F%E9%95%BF.jpg" alt="Desert near Karamay, Xinjiang">

    <dialog id="photo-lightbox" class="photo-lightbox" aria-label="Enlarged photograph">
      <div class="photo-lightbox-glass">
        <button type="button" class="photo-lightbox-close" aria-label="Close">&times;</button>
        <div class="photo-lightbox-img-wrap">
          <img id="photo-lightbox-img" src="" alt="">
        </div>
        <p id="photo-lightbox-caption" class="photo-lightbox-caption"></p>
      </div>
    </dialog>

    <script>
      (function () {
        const dialog = document.getElementById('photo-lightbox');
        const lbImg = document.getElementById('photo-lightbox-img');
        const lbCap = document.getElementById('photo-lightbox-caption');
        const closeBtn = dialog.querySelector('.photo-lightbox-close');

        document.querySelectorAll('.photo-grid figure.photo-cell').forEach(function (fig) {
          const img = fig.querySelector(':scope > img');
          if (!img) return;
          img.loading = 'lazy';
          img.decoding = 'async';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'photo-thumb-btn';
          const cap = fig.querySelector('figcaption');
          btn.setAttribute('aria-label', 'Enlarge: ' + (img.alt || (cap && cap.textContent.trim()) || 'photograph'));

          const glass = document.createElement('span');
          glass.className = 'photo-thumb-glass';
          fig.insertBefore(btn, img);
          glass.appendChild(img);
          btn.appendChild(glass);

          btn.addEventListener('click', function () {
            lbImg.src = img.currentSrc || img.src;
            lbImg.alt = img.alt || '';
            lbCap.innerHTML = cap ? cap.innerHTML : '';
            if (typeof dialog.showModal === 'function') {
              dialog.showModal();
            }
          });
        });

        function closeLb() {
          if (dialog.open) dialog.close();
          lbImg.removeAttribute('src');
        }

        closeBtn.addEventListener('click', closeLb);
        dialog.addEventListener('click', function (e) {
          if (e.target === dialog) closeLb();
        });
        dialog.addEventListener('close', function () {
          lbImg.removeAttribute('src');
        });
      })();
    </script>
    <script src="zen.js"></script>
  </body>
</html>
